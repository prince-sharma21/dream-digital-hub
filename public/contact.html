<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us | Dream Digital Hub</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== Price Ticker ===== -->
<div class="ticker">
  <div class="ticker-track" id="tickerTrack"><!-- filled by JS --></div>
</div>

<!-- ===== Header ===== -->
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo" id="logoWrap">
      <img id="logoImage" class="logo-img" alt="Dream Digital Hub logo" />
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
    <nav class="nav" id="navMenu">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<!-- ===== Page Hero ===== -->
<section class="page-hero">
  <div class="container">
    <h1>Contact Us</h1>
    <p>Tell us about your business and what you need help with — we'll get back to you quickly.</p>
  </div>
</section>

<!-- ===== Contact ===== -->
<section class="contact" id="contact">
  <div class="container">
    <div class="contact-wrap">
      <form class="contact-form" id="contactForm">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="tel" name="phone" placeholder="Your Phone" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
        <button type="submit" class="btn">Send Message</button>
      </form>
      <div class="contact-info">
        <p>📞 <span id="contactPhone">+91 90000 00000</span></p>
        <p>✉️ <span id="contactEmail">hello@dreamdigitalhub.com</span></p>
        <a id="whatsappBtn" class="btn whatsapp-btn" href="#" target="_blank">Chat on WhatsApp</a>
      </div>
    </div>
  </div>
</section>

<!-- ===== Footer ===== -->
<footer class="footer">
  <div class="container">
    <p id="footerText">© 2026 Dream Digital Hub. All Rights Reserved.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
